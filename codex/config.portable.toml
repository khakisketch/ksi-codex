# Portable KSI Codex behavior profile captured on 2026-08-24.
#
# SECURITY: approval_policy = "never" with sandbox_mode = "danger-full-access"
# grants Codex broad local authority. Install this only on a personal machine
# where that behavior is intentional. The installer never copies authentication,
# history, browser sessions, project trust entries, absolute paths, or secrets.

model = "gpt-5.6-sol"
model_reasoning_effort = "high"
personality = "pragmatic"
plan_mode_reasoning_effort = "xhigh"
approvals_reviewer = "user"
approval_policy = "never"
sandbox_mode = "danger-full-access"
web_search = "live"

[agents]
default_subagent_model = "gpt-5.6-terra"
default_subagent_reasoning_effort = "high"

[plugins."google-calendar@openai-curated"]
enabled = false

[plugins."gmail@openai-curated"]
enabled = false

[plugins."canva@openai-curated"]
enabled = false

[plugins."github@openai-curated"]
enabled = true

[plugins."codex-app-tools@openai-bundled"]
enabled = true

[plugins."sites@openai-bundled"]
enabled = true

[plugins."browser@openai-bundled"]
enabled = true

[plugins."chrome@openai-bundled"]
enabled = true

[plugins."visualize@openai-bundled"]
enabled = true

[features]
memories = true
hooks = false
js_repl = false
network_proxy = true
prevent_idle_sleep = true

[memories]
use_memories = true
generate_memories = true
disable_on_external_context = true
min_rate_limit_remaining_percent = 20

[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp"]
startup_timeout_ms = 20000
